plugins {
    id 'application'
}

application {
    mainClass = 'co.icesi.buscaminas.Main'
}

run {
    standardInput = System.in
    // la salida pasa por Gradle: se fuerza UTF-8 para que los acentos se vean bien
    jvmArgs '-Dstdout.encoding=UTF-8', '-Dstderr.encoding=UTF-8'
}

jar {
    manifest {
        attributes(
                'Main-Class': 'co.icesi.buscaminas.Main',
                'Class-Path': configurations.runtimeClasspath.resolve().collect { it.toURI() }.join(' ')
        )
    }
}
