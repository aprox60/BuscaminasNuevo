/*
 * Configuración común para todos los módulos (server y client).
 * Cada módulo define su propia clase principal en su build.gradle.
 */
subprojects {
    apply plugin: 'java'

    repositories {
        mavenCentral()
    }

    dependencies {
        implementation 'com.google.code.gson:gson:2.10.1'
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }
}
